name: StockML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test clean repo
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall builders scripts src portal tests

      - name: Check deployment shell scripts
        run: |
          bash -n deployment/vm/install_database.sh
          bash -n deployment/vm/install_full_scheduler.sh
          bash -n deployment/vm/install_portal_service.sh

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q
