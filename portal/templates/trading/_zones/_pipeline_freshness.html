<section class="zone trading-zone pipeline-zone" data-zone="pipeline-freshness" data-pipeline-refresh-url="/trading/_partials/pipeline-strip" data-pipeline-refresh-ms="{{ trading_cadence.pipeline_refresh_ms or 60000 }}">
  <div class="zone__header">
    <span>Pipeline Freshness</span>
    <span class="zone__header-meta">refreshes {{ trading_cadence.pipeline_refresh_label or "every 60s" }}</span>
  </div>
  <div class="zone__body" data-pipeline-strip>
    <div class="stale-banner" data-pipeline-stale-banner hidden>Pipeline freshness may be stale.</div>
    {% include "trading/_partials/pipeline_strip.html" %}
  </div>
</section>
