<section class="kpi-row trading-zone" data-zone="kpi-row">
  {% for card in trading_kpis.cards %}
    {% if card.href %}
      <a class="kpi-card kpi-card--clickable {{ 'kpi-card--alert' if card.alert else '' }}" href="{{ card.href }}">
        <span class="kpi-card__label">{{ card.label }}</span>
        <strong class="kpi-card__value {{ card.class or '' }}">{{ card.value }}</strong>
        <small class="kpi-card__detail">{{ card.detail }}</small>
      </a>
    {% else %}
      <article class="kpi-card">
        <span class="kpi-card__label">{{ card.label }}</span>
        <strong class="kpi-card__value {{ card.class or '' }}">{{ card.value }}</strong>
        <small class="kpi-card__detail">{{ card.detail }}</small>
      </article>
    {% endif %}
  {% endfor %}
</section>
