version: 1
per_symbol_forecast:
  artifact_dir: data/trading/per_symbol_forecast
  artifact_prefix: per_symbol_forecast
  diagnostic_only: true
  max_symbols: 100
  forecast_horizon_days: 5
  stop_multiplier: 1.0
  take_profit_multiplier: 1.5
  tier_c_enabled: false
  forecast_bounds:
    reasonable_max_1d_return_bps: 200
    reasonable_max_5d_return_bps: 500
    reasonable_max_move_bps: 1000
    suspicious_warn_threshold_bps: 300
    cap_at_max: true
    max_reasonable_slope_bps_per_unit: 1000
