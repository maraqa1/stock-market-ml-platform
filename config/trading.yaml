trading:
  mode: paper
  dry_run: true
  live_trading_enabled: false
  paper_trading_enabled: true
short_side_policy:
  enabled: false
  allow_shorts_in_validation: false
  require_short_side_attribution_pass: true
  research_only_when_disabled: true
  min_closed_short_trades_for_enablement: 50
  min_short_profit_factor_for_enablement: 1.10
  min_short_win_rate_for_enablement: 0.45
direction_authority:
  execution_direction_source: source_trade_action
  allow_planner_derived_execution: false
  require_source_approval: true
  require_memory_alignment_for_full_approval: true
  memory_insufficient_default: watch
  block_direction_memory_conflict: true
  allow_inverse_execution: false
  inverse_min_sample_count: 50
  block_uncalibrated_probability_for_sizing: true
  block_short_side_until_validated: true
source_approval_expansion:
  enabled: false
  mode: diagnostic_only
  side: LONG_ONLY
  min_ticker_direction_sample_count: 50
  require_ticker_direction_bias: trust_long
  require_positive_validated_expected_return: true
  require_expected_return_scope_in:
    - ticker
    - bucket
    - side
  require_risk_tier_not_reject: true
  require_volatility_not_extreme: true
  require_source_no_decision_reason_in:
    - source_threshold_too_strict
    - weak_confidence
  block_if:
    - direction_memory_conflict
    - meta_label_rejected
    - model_evidence_missing
    - risk_gate_failed
    - asset_not_overnight_tradable
    - price_below_minimum
volatility_opportunity:
  enabled: false
  side: LONG_ONLY
  min_validated_expected_return_bps: 40
  min_validated_profit_factor: 1.10
  min_validated_hit_rate: 0.45
  min_ticker_direction_sample_count: 5
  require_ticker_direction_bias: trust_long
  allowed_expected_return_scopes:
    - ticker
    - bucket
    - side
direction_gate:
  enabled: true
  require_source_trade_action: true
  allow_directional_action_execution: false
  allow_planner_derived_no_decision_execution: true
  require_positive_validated_expected_return: true
  allow_missing_validated_return: true
  min_validated_profit_factor: 1.05
  require_meta_label_acceptance: false
  block_negative_expected_return: true
  inverse_warning_blocks_execution: true
  shorts_require_short_policy_pass: true
ticker_direction_memory:
  enabled: true
  min_ticker_samples: 5
  min_inverse_advantage_bps: 25
  min_confidence: 0.60
  no_trade_loss_bps: -50
short_direction_gate:
  enabled: true
  min_short_win_rate: 0.45
  min_short_profit_factor: 1.10
  require_positive_short_expected_return: true
  block_high_squeeze_risk: true
  default_short_decision: research_only
